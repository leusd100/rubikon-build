name: PageSpeed Monitor

# Production PageSpeed Insights (lab): 3 runs per form factor, per-metric medians, raw PSI JSON as an artifact, a Markdown
# table in the run summary. Reporting only — never a gate on scores.
#
# Triggers are deliberately few:
#   - after each deploy of main: https://rubikonbuild.com/, mobile + desktop (6 PSI calls); waits for Cloudflare's
#     "Workers Builds: rubikon-build" check on that exact commit, so PSI measures the code that was just merged, not the
#     previous deploy;
#   - daily, one page per template (PSI_DAILY_PAGES, 24 PSI calls): DebugBear watched 11 pages daily until its
#     subscription ended on 27.10.2026 (docs/performance/debugbear-2026-10-27/), and this is now the only production
#     signal for the pages after HOME. HOME on both form factors, the rest on mobile, where DebugBear saw every
#     regression (desktop held 0.89–1.00 over its two weeks). It also shows drift no deploy caused (Cloudflare
#     features, PSI/Lighthouse updates);
#   - manually, optionally for another https:// URL (e.g. a Workers preview).
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'https:// URL to measure'
        required: false
        default: 'https://rubikonbuild.com/'
      runs:
        description: 'Runs per form factor (1–5)'
        required: false
        default: '3'
      strategy:
        description: 'Form factor to measure (choose one to save PSI quota)'
        type: choice
        options: [both, mobile, desktop]
        default: both

permissions:
  contents: read
  checks: read

concurrency:
  # A newer deploy supersedes a measurement still waiting for or measuring the previous one; a deploy does not cancel
  # the daily pages.
  group: pagespeed-monitor-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  pagespeed:
    name: PageSpeed Insights (production)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Wait for the Cloudflare deploy of this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name == "Workers Builds: rubikon-build")][0] | "\(.status)/\(.conclusion)"' || true)
            echo "Workers Builds: ${state:-not reported yet}"
            case "$state" in
              completed/success) sleep 60; exit 0 ;;  # let the new version reach the edge before measuring
              completed/*) echo "Deploy did not succeed; nothing new to measure."; echo "skip=true" >> "$GITHUB_ENV"; exit 0 ;;
            esac
            sleep 15
          done
          echo "Deploy check not complete after 15 minutes; skipping."
          echo "skip=true" >> "$GITHUB_ENV"

      - name: Run PageSpeed Insights
        if: env.skip != 'true'
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          PSI_URL: ${{ inputs.url || 'https://rubikonbuild.com/' }}
          PSI_RUNS: ${{ inputs.runs || '3' }}
          PSI_STRATEGY: ${{ inputs.strategy || 'both' }}
          # path:form factor. /metalokonstruktsii stands for the direction template (DirectionDetail) without the
          # configurator or the planner, which /angary and /zernoskhovyshcha add.
          PSI_DAILY_PAGES: >-
            /:both
            /angary:mobile
            /zernoskhovyshcha:mobile
            /pro-nas:mobile
            /napryamky:mobile
            /yak-pratsyuiemo:mobile
            /metalokonstruktsii:mobile
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            node scripts/perf/pagespeed.mjs --url "$PSI_URL" --runs "$PSI_RUNS" --strategy "$PSI_STRATEGY" --out psi-results
            exit
          fi
          # One page after another (parallel PSI calls compete for the same origin). A page PSI could not measure at all
          # fails the run, but only after every page has had its turn.
          status=0
          for page in $PSI_DAILY_PAGES; do
            path="${page%:*}"
            slug="${path//\//}"
            node scripts/perf/pagespeed.mjs --url "https://rubikonbuild.com${path}" --runs "$PSI_RUNS" \
              --strategy "${page##*:}" --out "psi-results/${slug:-home}" || status=1
          done
          exit "$status"

      - name: Upload PSI results
        if: always() && env.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pagespeed-${{ github.run_number }}-${{ github.sha }}
          path: psi-results/
          if-no-files-found: ignore
          retention-days: 90
