name: PageSpeed Monitor

# Production PageSpeed Insights (lab): 3 runs per form factor, per-metric medians, raw PSI JSON as an artifact, a Markdown
# table in the run summary. Reporting only — never a gate on scores.
#
# Triggers are deliberately few:
#   - after each deploy of main: https://rubikonbuild.com/, mobile + desktop (6 PSI calls); waits for Cloudflare's
#     "Workers Builds: rubikon-build" check on that exact commit, so PSI measures the code that was just merged, not the
#     previous deploy;
#   - daily, one page per template (PSI_DAILY_PAGES, 24 PSI calls): DebugBear watched 10 pages on both form factors
#     daily until its subscription ended on 27.10.2026 (docs/performance/debugbear-2026-10-27/), and this is now the
#     only production signal for the pages after HOME. HOME on both form factors, the rest on mobile, where the scores
#     are lowest and moved most (DebugBear's desktop medians held 0.89–1.00, single runs no lower than 0.85).
#     /polityka-konfidentsiinosti, text only at 0.97–1.00, is left out. It also shows drift no deploy caused
#     (Cloudflare features, PSI/Lighthouse updates);
#   - manually, optionally for another https:// URL (e.g. a Workers preview).
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'https:// URL to measure'
        required: false
        default: 'https://rubikonbuild.com/'
      runs:
        description: 'Runs per form factor (1–5)'
        required: false
        default: '3'
      strategy:
        description: 'Form factor to measure (choose one to save PSI quota)'
        type: choice
        options: [both, mobile, desktop]
        default: both

permissions:
  contents: read
  checks: read

concurrency:
  # A newer deploy or manual run supersedes a measurement still waiting for or measuring the previous one; neither
  # cancels the daily pages. A deploy measured while the daily run is on HOME may get PSI's cached analysis of the old
  # code (the cache check in pagespeed.mjs sees only its own run): compare its fetch times with the deploy time.
  group: pagespeed-monitor-${{ github.event_name == 'schedule' && 'daily' || 'deploy' }}
  cancel-in-progress: true

jobs:
  pagespeed:
    name: PageSpeed Insights (production)
    runs-on: ubuntu-latest
    # the daily pages' own time limits (below) add up to 48 minutes
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Wait for the Cloudflare deploy of this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name == "Workers Builds: rubikon-build")][0] | "\(.status)/\(.conclusion)"' || true)
            echo "Workers Builds: ${state:-not reported yet}"
            case "$state" in
              completed/success) sleep 60; exit 0 ;;  # let the new version reach the edge before measuring
              completed/*) echo "Deploy did not succeed; nothing new to measure."; echo "skip=true" >> "$GITHUB_ENV"; exit 0 ;;
            esac
            sleep 15
          done
          echo "Deploy check not complete after 15 minutes; skipping."
          echo "skip=true" >> "$GITHUB_ENV"

      - name: Run PageSpeed Insights
        if: env.skip != 'true'
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          PSI_URL: ${{ inputs.url || 'https://rubikonbuild.com/' }}
          PSI_RUNS: ${{ inputs.runs || '3' }}
          PSI_STRATEGY: ${{ inputs.strategy || 'both' }}
          # path:form factor. /metalokonstruktsii stands for the direction template (DirectionDetail) as it is; /angary
          # adds the configurator to it, /zernoskhovyshcha the grain complex band.
          PSI_DAILY_PAGES: >-
            /:both
            /angary:mobile
            /zernoskhovyshcha:mobile
            /pro-nas:mobile
            /napryamky:mobile
            /yak-pratsyuiemo:mobile
            /metalokonstruktsii:mobile
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            node scripts/perf/pagespeed.mjs --url "$PSI_URL" --runs "$PSI_RUNS" --strategy "$PSI_STRATEGY" --out psi-results
            exit
          fi
          # One page after another (parallel PSI calls compete for the same origin). A page PSI could not measure at all
          # fails the run, but only after every page has had its turn: each page gets 6 minutes per form factor — about
          # three times a slow day's PSI — so a PSI outage (3 × 120 s per call) cannot use up the pages after it.
          status=0
          for page in $PSI_DAILY_PAGES; do
            path="${page%:*}"
            strategy="${page##*:}"
            slug="${path//\//}"
            minutes=6
            if [ "$strategy" = both ]; then minutes=12; fi
            if ! timeout "${minutes}m" node scripts/perf/pagespeed.mjs --url "https://rubikonbuild.com${path}" \
              --runs "$PSI_RUNS" --strategy "$strategy" --out "psi-results/${slug:-home}"; then
              status=1
              echo "**${path}**: not measured — PSI failed or took longer than ${minutes} min." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit "$status"

      - name: Upload PSI results
        if: always() && env.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pagespeed-${{ github.run_number }}-${{ github.sha }}
          path: psi-results/
          if-no-files-found: ignore
          retention-days: 90
