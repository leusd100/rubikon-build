name: Main Regression

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build regression artifact
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
      - name: Build
        run: pnpm build
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: main-production-build
          path: dist/
          if-no-files-found: error
          retention-days: 2

  e2e:
    name: Main E2E (${{ matrix.shard }}/3)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      PLAYWRIGHT_USE_PRODUCTION_BUILD: 'true'
      PLAYWRIGHT_BLOB_REPORT: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
      - uses: actions/download-artifact@v5
        with:
          name: main-production-build
          path: dist
      - uses: ./.github/actions/setup-playwright
      - name: Run full E2E shard
        run: pnpm exec playwright test --project=desktop-chromium --project=mobile-chromium --shard=${{ matrix.shard }}/3
      - name: Upload shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: main-e2e-blob-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: error
          retention-days: 7

  visual:
    name: Main visual (${{ matrix.shard }}/2)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      PLAYWRIGHT_USE_PRODUCTION_BUILD: 'true'
      PLAYWRIGHT_BLOB_REPORT: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
      - uses: actions/download-artifact@v5
        with:
          name: main-production-build
          path: dist
      - uses: ./.github/actions/setup-playwright
      - name: Run complete visual shard
        run: pnpm exec playwright test --project=visual-chromium --shard=${{ matrix.shard }}/2
      - name: Upload shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: main-visual-blob-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: error
          retention-days: 7

  report:
    name: Main Regression
    if: ${{ !cancelled() }}
    needs: [e2e, visual]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
      - name: Download shard reports
        uses: actions/download-artifact@v5
        with:
          pattern: main-*-blob-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge Playwright report
        run: pnpm exec playwright merge-reports --reporter=html ./all-blob-reports
      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: main-playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Preserve regression result
        env:
          E2E: ${{ needs.e2e.result }}
          VISUAL: ${{ needs.visual.result }}
        run: test "$E2E" = success && test "$VISUAL" = success
