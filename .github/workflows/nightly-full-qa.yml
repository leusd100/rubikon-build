name: Nightly Full QA

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-full-qa
  cancel-in-progress: false

jobs:
  build:
    name: Build nightly artifact
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
      - name: Lint
        run: pnpm lint
      - name: Explicit typecheck
        run: pnpm typecheck
      - name: Unit tests with coverage
        run: pnpm test:unit:coverage
      - name: Build
        run: pnpm build
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: nightly-production-build
          path: dist/
          if-no-files-found: error
          retention-days: 2

  e2e:
    name: Nightly E2E (${{ matrix.shard }}/6)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      PLAYWRIGHT_USE_PRODUCTION_BUILD: 'true'
      PLAYWRIGHT_BLOB_REPORT: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
      - uses: actions/download-artifact@v5
        with:
          name: nightly-production-build
          path: dist
      - uses: ./.github/actions/setup-playwright
      - name: Run full E2E shard
        # The split and limits of Main Regression (#232): 12 min of tests + ~1 min of setup and upload fit the 15-min job
        # limit, so a slow shard fails with a named global timeout and still uploads its blob report, instead of being
        # cancelled without one, as shard 1/4 was on 23.10 and nearly was on 28.10 (17.8 of 18 min).
        run: pnpm exec playwright test --project=desktop-chromium --project=mobile-chromium --shard=${{ matrix.shard }}/6 --global-timeout=720000
      - name: Upload shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-e2e-blob-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: error
          retention-days: 7

  visual:
    name: Nightly visual (${{ matrix.shard }}/2)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      PLAYWRIGHT_USE_PRODUCTION_BUILD: 'true'
      PLAYWRIGHT_BLOB_REPORT: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
      - uses: actions/download-artifact@v5
        with:
          name: nightly-production-build
          path: dist
      - uses: ./.github/actions/setup-playwright
      - name: Run site-wide visual shard
        run: pnpm exec playwright test --project=visual-chromium --shard=${{ matrix.shard }}/2
      - name: Upload shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-visual-blob-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: error
          retention-days: 7

  lighthouse:
    name: Lighthouse (${{ matrix.profile }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        profile: [home, standard, grain]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
      - uses: actions/download-artifact@v5
        with:
          name: nightly-production-build
          path: dist
      - uses: ./.github/actions/setup-playwright
      - name: Run Lighthouse profile
        env:
          LHCI_PROFILE: ${{ matrix.profile }}
        run: pnpm exec lhci autorun
      - name: Upload Lighthouse diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ matrix.profile }}
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  report:
    name: Nightly Full QA
    if: ${{ !cancelled() }}
    needs: [build, e2e, visual, lighthouse]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful nightly build
        env:
          BUILD: ${{ needs.build.result }}
        run: |
          if [ "$BUILD" != success ]; then
            echo "::error::Nightly build did not succeed ($BUILD); skipping Playwright report collection."
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
      - name: Download shard reports
        uses: actions/download-artifact@v5
        with:
          pattern: nightly-*-blob-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge Playwright report
        run: pnpm exec playwright merge-reports --reporter=html ./all-blob-reports
      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Preserve full QA result
        env:
          BUILD: ${{ needs.build.result }}
          E2E: ${{ needs.e2e.result }}
          VISUAL: ${{ needs.visual.result }}
          LIGHTHOUSE: ${{ needs.lighthouse.result }}
        run: >-
          test "$BUILD" = success &&
          test "$E2E" = success &&
          test "$VISUAL" = success &&
          test "$LIGHTHOUSE" = success
