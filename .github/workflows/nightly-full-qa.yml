name: Nightly Full QA

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-full-qa
  cancel-in-progress: false

jobs:
  build:
    name: Build nightly artifact
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
      - name: Lint
        run: pnpm lint
      - name: Explicit typecheck
        run: pnpm typecheck
      - name: Unit tests with coverage
        run: pnpm test:unit:coverage
      - name: Build
        run: pnpm build
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: nightly-production-build
          path: dist/
          if-no-files-found: error
          retention-days: 2

  e2e:
    name: Nightly E2E (${{ matrix.shard }}/4)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PLAYWRIGHT_USE_PRODUCTION_BUILD: 'true'
      PLAYWRIGHT_BLOB_REPORT: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
      - uses: actions/download-artifact@v5
        with:
          name: nightly-production-build
          path: dist
      - uses: ./.github/actions/setup-playwright
      - name: Run full E2E shard
        run: pnpm exec playwright test --project=desktop-chromium --project=mobile-chromium --shard=${{ matrix.shard }}/4
      - name: Upload shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-e2e-blob-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: error
          retention-days: 7

  visual:
    name: Nightly visual (${{ matrix.shard }}/2)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      PLAYWRIGHT_USE_PRODUCTION_BUILD: 'true'
      PLAYWRIGHT_BLOB_REPORT: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
      - uses: actions/download-artifact@v5
        with:
          name: nightly-production-build
          path: dist
      - uses: ./.github/actions/setup-playwright
      - name: Run site-wide visual shard
        run: pnpm exec playwright test --project=visual-chromium --shard=${{ matrix.shard }}/2
      - name: Upload shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-visual-blob-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: error
          retention-days: 7

  lighthouse:
    name: Lighthouse (${{ matrix.profile }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        profile: [home, standard, grain]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
      - uses: actions/download-artifact@v5
        with:
          name: nightly-production-build
          path: dist
      - uses: ./.github/actions/setup-playwright
      - name: Run Lighthouse profile
        env:
          LHCI_PROFILE: ${{ matrix.profile }}
        run: pnpm exec lhci autorun
      - name: Upload Lighthouse diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ matrix.profile }}
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      # On every night, not only a failed one: a green night is the baseline a later regression is read against.
      - name: Keep the night's Lighthouse numbers
        if: ${{ !cancelled() }}
        env:
          LHCI_PROFILE: ${{ matrix.profile }}
        run: node scripts/ci/nightly-history.mjs lighthouse --profile "$LHCI_PROFILE" --dir .lighthouseci --out "nightly-metrics/lighthouse-$LHCI_PROFILE.json"
      - name: Upload the night's Lighthouse numbers
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-metrics-${{ matrix.profile }}
          path: nightly-metrics/
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: Nightly Full QA
    if: ${{ !cancelled() }}
    needs: [build, e2e, visual, lighthouse]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful nightly build
        env:
          BUILD: ${{ needs.build.result }}
        run: |
          if [ "$BUILD" != success ]; then
            echo "::error::Nightly build did not succeed ($BUILD); skipping Playwright report collection."
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
      - name: Download shard reports
        uses: actions/download-artifact@v5
        with:
          pattern: nightly-*-blob-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge Playwright report
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: nightly-tests.json
        run: pnpm exec playwright merge-reports --reporter=html,json ./all-blob-reports
      - name: Keep the night's test counts
        run: node scripts/ci/nightly-history.mjs tests --report nightly-tests.json --out nightly-metrics/tests.json
      - name: Upload the night's test counts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-metrics-tests
          path: nightly-metrics/
          retention-days: 7
      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Preserve full QA result
        env:
          BUILD: ${{ needs.build.result }}
          E2E: ${{ needs.e2e.result }}
          VISUAL: ${{ needs.visual.result }}
          LIGHTHOUSE: ${{ needs.lighthouse.result }}
        run: >-
          test "$BUILD" = success &&
          test "$E2E" = success &&
          test "$VISUAL" = success &&
          test "$LIGHTHOUSE" = success

  # Apart from `report`, so a night that broke before its reports still gets its line, and so the one token that reads
  # other runs' artifacts is this job's. It never changes the night's verdict.
  history:
    name: Nightly history
    if: ${{ !cancelled() }}
    needs: [build, e2e, visual, lighthouse, report]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download tonight's numbers
        # None exist when the build failed: that night is still recorded, with its gaps
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          pattern: nightly-metrics-*
          path: nightly-metrics
          merge-multiple: true
      - name: Fetch the history so far
        # The newest file of this branch, so a run dispatched on a branch cannot enter main's history. A failed download
        # fails this step and skips the upload below: the chain stays on the last good artifact and nothing is overwritten.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=nightly-history&per_page=100" \
            --jq "[.artifacts[] | select(.expired == false and .workflow_run.head_branch == \"$GITHUB_REF_NAME\")][0].workflow_run.id // empty")"
          if [ -n "$run" ]; then
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name nightly-history --dir history
          fi
      - name: Record tonight
        env:
          RESULT_BUILD: ${{ needs.build.result }}
          RESULT_E2E: ${{ needs.e2e.result }}
          RESULT_VISUAL: ${{ needs.visual.result }}
          RESULT_LIGHTHOUSE: ${{ needs.lighthouse.result }}
        run: |
          NIGHT_DATE="$(date -u +%F)" node scripts/ci/nightly-history.mjs record \
            --metrics nightly-metrics --history history/nightly-history.ndjson --out history/nightly-history.ndjson
      - name: Carry the history forward
        uses: actions/upload-artifact@v4
        with:
          name: nightly-history
          path: history/nightly-history.ndjson
          if-no-files-found: error
          retention-days: 90
