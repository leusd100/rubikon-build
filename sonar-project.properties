# Rubikon Build — SonarQube Cloud configuration
#
# Policy summary (see docs/ or the PR that introduced this file for the full writeup):
# unit coverage is scoped to plain .ts logic (API routes, app/lib, robots.ts/sitemap.ts)
# — the only category this project's plain-node Vitest suite can exercise without adding a
# DOM. app/data/** is declarative content, not logic, and is excluded (see below). React components (.tsx) and hooks (need a
# component-rendering context, same problem as .tsx despite the extension) are
# deliberately covered by Playwright e2e instead; that's this repo's actual test
# architecture, not a gap. sonar.coverage.exclusions below mirrors vitest.config.ts's own
# coverage.include/exclude boundary line for line, so Sonar's coverage metric reflects the
# same, real scope rather than silently disagreeing with what's actually measured.

sonar.projectKey=leusd100_rubikon-build
sonar.organization=leusd100

# Main source code
sonar.sources=app,radar-prototype

# Test code — covers both Vitest unit specs (tests/unit) and Playwright e2e/visual specs
# (tests/e2e), plus radar-prototype's own node:test suite. Sonar's test/source split is
# binary (test vs. production code); it has no separate "e2e" category, so this is the
# correct classification for all of it — e2e files are still fully analyzed for
# code-quality/security issues, they're just not expected to carry unit coverage.
sonar.tests=tests,radar-prototype/test
sonar.test.inclusions=tests/**,radar-prototype/test/**

# Prevent tests inside radar-prototype from being counted as production source
sonar.exclusions=\
radar-prototype/test/**,\
**/.vinext/**,\
**/.next/**,\
**/dist/**,\
**/node_modules/**,\
**/playwright-report/**,\
**/test-results/**,\
**/coverage/**,\
**/public/**

# Coverage exclusions — deliberately architecture-shaped, not a blanket
# "app/components/**" carve-out or a per-file allowlist. Five categories are out:
#   *.tsx                    React UI, covered by Playwright e2e instead
#   app/hooks/**             the two top-level, non-component-scoped hooks — needs a
#                             component-rendering context to invoke, same reason as .tsx
#   app/components/**/use*.ts the five component-scoped hooks (useLayerLifecycle.ts,
#                             useWebglSupport.ts, useBuildProgress.ts, etc.) that live
#                             inline next to the components using them rather than under
#                             app/hooks/ — same "needs a mounted component/Canvas to invoke"
#                             reason, just a different directory. app/hooks/** alone never
#                             matched these; closing that gap surfaced a pre-existing
#                             miscategorisation, not a new carve-out (see vitest.config.ts
#                             for the fuller note). Safe to be a broad use*.ts pattern
#                             rather than a per-file list because every hook in this repo is
#                             named use* by React convention — confirmed by hand that no
#                             non-hook file under app/components matches it.
#   app/types/**              type-only, no runtime code to instrument
#   app/data/**               declarative content only — exported const literals (directions,
#                             page copy, manifests, navigation). No exported executable logic
#                             lives there: the four helpers that used to (getDirection,
#                             getDirectionPage, createDirectionMetadata, webpSrcSet) were moved
#                             to app/lib and now carry real behavioural unit tests. What remains
#                             inside app/data is a couple of module-private template-string
#                             builders that author the literals themselves, with no behaviour a
#                             test could assert beyond the literal values. Coverage is the ONLY
#                             thing excluded here — every file in app/data is still fully
#                             analysed for bugs, code smells and security.
# Everything else under app/ — API routes, app/lib, robots.ts, sitemap.ts — stays IN the
# coverage metric and is expected to carry real tests. Keep the boundary honest: a new
# function belongs in app/lib, not next to the data it reads. See vitest.config.ts's
# test.coverage.include/exclude for the enforced mirror.
#
# app/components/configurator/three/proceduralTextures.ts (Phase 3F.1) is the newest instance of
# the same "needs a real browser, not jsdom" rule above, via `document.createElement('canvas')
# .getContext('2d')` instead of component-rendering — this repo carries no canvas polyfill for
# the same reason it carries no jsdom/testing-library. The actual algorithmic content (PRNG, noise
# field, per-pixel encoding formulas) was pulled out into noiseField.ts, a pure module with no
# canvas dependency, which DOES carry real tests and stays in this metric; only the thin
# canvas/THREE.Texture-wiring shell is excluded here.
sonar.coverage.exclusions=\
app/**/*.tsx,\
app/hooks/**,\
app/components/**/use*.ts,\
app/types/**,\
app/data/**,\
app/components/configurator/three/proceduralTextures.ts

# LCOV coverage report, generated by `pnpm test:unit:coverage` (vitest --coverage). The
# SonarQube Cloud workflow runs that before the scan step specifically so this file exists.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Duplication exclusion for HomeHeroVideo.tsx/AboutHeroVideo.tsx specifically — a known,
# previously-reviewed finding (flagged in an earlier full-site audit as a P1 item and
# deliberately left alone), not a new one. The two components' variantConfig shape and
# their <DirectionHeroVideo> call share real structural similarity by design: same hero
# media component, same three-variant (desktop/phone/tablet) split, deliberately parallel
# so the two pages' hero behavior stays easy to compare and reason about side by side.
# Collapsing that into one shared component was the alternative considered and rejected —
# it would mean a single component branching on which page it's rendering into, which is a
# real architecture change, not a duplication fix, and out of scope for whatever change
# happens to be touching either file at the time. Scoped to exactly these two files, not a
# general app/components/** carve-out.
sonar.cpd.exclusions=\
app/components/HomeHeroVideo.tsx,\
app/components/AboutHeroVideo.tsx

# Narrow rule-level suppression, not a path exclusion: typescript:S1607 ("Remove this unit
# test or explain why it is ignored") fires on every Playwright test.skip(condition,
# reason) call in tests/e2e/**, even though the reason is already given as that call's own
# second argument — the rule's generic JS/TS implementation doesn't appear to recognize
# Playwright's specific two-argument conditional-skip signature as an explanation, only a
# plain // comment adjacent to the call. This does NOT touch any other rule, and does NOT
# exclude tests/e2e/** from analysis — every other check (real bugs, security, other code
# smells) still runs on that whole directory. SonarSource's own docs note issue-level
# ignore rules like this are primarily configured through the SonarCloud project UI
# (Administration > General Settings > Issues); this property-file form is included as a
# best-effort mirror of that same intent for anyone running an analysis outside the UI, but
# hasn't been confirmed authoritative on SonarCloud specifically. Until/unless that's
# confirmed, tests/e2e/**/*.spec.ts keeps a short explanatory // comment above each
# test.skip(...) call as the primary, already-verified-working mitigation — do not remove
# those comments on the assumption this property alone covers it.
sonar.issue.ignore.multicriteria=e2eSkipReason
sonar.issue.ignore.multicriteria.e2eSkipReason.ruleKey=typescript:S1607
sonar.issue.ignore.multicriteria.e2eSkipReason.resourceKey=tests/e2e/**/*.spec.ts

# Source encoding
sonar.sourceEncoding=UTF-8
