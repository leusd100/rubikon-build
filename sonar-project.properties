# Rubikon Build — SonarQube Cloud configuration
#
# Policy summary (see docs/ or the PR that introduced this file for the full writeup):
# unit coverage is scoped to plain .ts logic (API routes, app/lib, robots.ts/sitemap.ts)
# — the only category this project's plain-node Vitest suite can exercise without adding a
# DOM. app/data/** is declarative content, not logic, and is excluded (see below). React components (.tsx) and hooks (need a
# component-rendering context, same problem as .tsx despite the extension) are
# deliberately covered by Playwright e2e instead; that's this repo's actual test
# architecture, not a gap. sonar.coverage.exclusions below mirrors vitest.config.ts's own
# coverage.include/exclude boundary line for line, so Sonar's coverage metric reflects the
# same, real scope rather than silently disagreeing with what's actually measured.

sonar.projectKey=leusd100_rubikon-build
sonar.organization=leusd100

# Main source code
sonar.sources=app,radar-prototype

# Test code — covers both Vitest unit specs (tests/unit) and Playwright e2e/visual specs
# (tests/e2e), plus radar-prototype's own node:test suite. Sonar's test/source split is
# binary (test vs. production code); it has no separate "e2e" category, so this is the
# correct classification for all of it — e2e files are still fully analyzed for
# code-quality/security issues, they're just not expected to carry unit coverage.
sonar.tests=tests,radar-prototype/test
sonar.test.inclusions=tests/**,radar-prototype/test/**

# Prevent tests inside radar-prototype from being counted as production source
sonar.exclusions=\
radar-prototype/test/**,\
**/.vinext/**,\
**/.next/**,\
**/dist/**,\
**/node_modules/**,\
**/playwright-report/**,\
**/test-results/**,\
**/coverage/**,\
**/public/**

# Coverage exclusions — deliberately architecture-shaped, not a blanket
# "app/components/**" carve-out or a per-file allowlist. Five categories are out:
#   *.tsx                    React UI, covered by Playwright e2e instead
#   app/hooks/**             the two top-level, non-component-scoped hooks — needs a
#                             component-rendering context to invoke, same reason as .tsx
#   app/components/**/use*.ts the five component-scoped hooks (useLayerLifecycle.ts,
#                             useWebglSupport.ts, useBuildProgress.ts, etc.) that live
#                             inline next to the components using them rather than under
#                             app/hooks/ — same "needs a mounted component/Canvas to invoke"
#                             reason, just a different directory. app/hooks/** alone never
#                             matched these; closing that gap surfaced a pre-existing
#                             miscategorisation, not a new carve-out (see vitest.config.ts
#                             for the fuller note). Safe to be a broad use*.ts pattern
#                             rather than a per-file list because every hook in this repo is
#                             named use* by React convention — confirmed by hand that no
#                             non-hook file under app/components matches it.
#   app/types/**              type-only, no runtime code to instrument
#   app/data/**               declarative content only — exported const literals (directions,
#                             page copy, manifests, navigation). No exported executable logic
#                             lives there: the four helpers that used to (getDirection,
#                             getDirectionPage, createDirectionMetadata, webpSrcSet) were moved
#                             to app/lib and now carry real behavioural unit tests. What remains
#                             inside app/data is a couple of module-private template-string
#                             builders that author the literals themselves, with no behaviour a
#                             test could assert beyond the literal values. Coverage is the ONLY
#                             thing excluded here — every file in app/data is still fully
#                             analysed for bugs, code smells and security.
# Everything else under app/ — API routes, app/lib, robots.ts, sitemap.ts — stays IN the
# coverage metric and is expected to carry real tests. Keep the boundary honest: a new
# function belongs in app/lib, not next to the data it reads. See vitest.config.ts's
# test.coverage.include/exclude for the enforced mirror.
#
# app/components/configurator/three/proceduralTextures.ts (Phase 3F.1) is the newest instance of
# the same "needs a real browser, not jsdom" rule above, via `document.createElement('canvas')
# .getContext('2d')` instead of component-rendering — this repo carries no canvas polyfill for
# the same reason it carries no jsdom/testing-library. The actual algorithmic content (PRNG, noise
# field, per-pixel encoding formulas) was pulled out into noiseField.ts, a pure module with no
# canvas dependency, which DOES carry real tests and stays in this metric; only the thin
# canvas/THREE.Texture-wiring shell is excluded here.
sonar.coverage.exclusions=\
app/**/*.tsx,\
app/hooks/**,\
app/components/**/use*.ts,\
app/types/**,\
app/data/**,\
app/components/configurator/three/proceduralTextures.ts

# LCOV coverage report, generated by `pnpm test:unit:coverage` (vitest --coverage). The
# SonarQube Cloud workflow runs that before the scan step specifically so this file exists.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Duplication exclusion for AboutHeroVideo.tsx (its pair, HomeHeroVideo.tsx, was removed on 2026-10-01: HOME v2
# renders HomeV2HeroMedia, and nothing imported the old component). The original reasoning — a known,
# previously-reviewed finding (flagged in an earlier full-site audit as a P1 item and
# deliberately left alone), not a new one. The two components' variantConfig shape and
# their <DirectionHeroVideo> call share real structural similarity by design: same hero
# media component, same three-variant (desktop/phone/tablet) split, deliberately parallel
# so the two pages' hero behavior stays easy to compare and reason about side by side.
# Collapsing that into one shared component was the alternative considered and rejected —
# it would mean a single component branching on which page it's rendering into, which is a
# real architecture change, not a duplication fix, and out of scope for whatever change
# happens to be touching either file at the time.
#
# responsiveImageManifest.ts is generated declarative data: every entry must repeat the
# same three width keys by contract. Counting that fixed record shape as copy/paste makes
# each new image variant fail the new-code gate without identifying maintainable logic.
# Keep this exclusion scoped to the generated manifests; executable responsive-image logic
# stays included in duplication analysis.
#
# directionHeroImageManifest.ts and directionsHeroSequenceManifest.ts are the same kind of data,
# written by scripts/generate-direction-hero-images.py: one record per direction with the same
# four keys and four content hashes. Re-encoding the artwork (#136) changes every hash, and CPD
# then counts the unchanged record shape as new duplicated code (10 lines in the sequence
# manifest failed the 3 % gate). The only code in them is a four-line srcset template.
#
# deliveryModel.ts is the Delivery Model canon (docs/delivery-model.md): eight stages that
# repeat one typed record shape by contract — per-format texts, result, gate, documents. CPD
# normalises string literals, so stages with different copy read as one duplicated block.
# Its helpers live in app/lib/deliveryModel.ts and stay included in duplication analysis.
sonar.cpd.exclusions=\
app/components/AboutHeroVideo.tsx,\
app/data/responsiveImageManifest.ts,\
app/data/directionHeroImageManifest.ts,\
app/data/directionsHeroSequenceManifest.ts,\
app/data/deliveryModel.ts

# Narrow rule-level suppression, not a path exclusion: typescript:S1607 ("Remove this unit
# test or explain why it is ignored") fires on every Playwright test.skip(condition,
# reason) call in tests/e2e/**, even though the reason is already given as that call's own
# second argument — the rule's generic JS/TS implementation doesn't appear to recognize
# Playwright's specific two-argument conditional-skip signature as an explanation, only a
# plain // comment adjacent to the call. This does NOT touch any other rule, and does NOT
# exclude tests/e2e/** from analysis — every other check (real bugs, security, other code
# smells) still runs on that whole directory. SonarSource's own docs note issue-level
# ignore rules like this are primarily configured through the SonarCloud project UI
# (Administration > General Settings > Issues); this property-file form is included as a
# best-effort mirror of that same intent for anyone running an analysis outside the UI, but
# hasn't been confirmed authoritative on SonarCloud specifically. Until/unless that's
# confirmed, tests/e2e/**/*.spec.ts keeps a short explanatory // comment above each
# test.skip(...) call as the primary, already-verified-working mitigation — do not remove
# those comments on the assumption this property alone covers it.
sonar.issue.ignore.multicriteria=e2eSkipReason,r3fIntrinsicProps,r3fSpikeProps,linkBlocking,prngInt32,scrollRegionApproaches,scrollRegionClarification,scrollRegionComparison,scrollRegionBuilder,safariList,restWindow,noReloadWindow,printIsolation,groupMessengers,groupStamp,groupChangeBanner,previewDialog
sonar.issue.ignore.multicriteria.e2eSkipReason.ruleKey=typescript:S1607
sonar.issue.ignore.multicriteria.e2eSkipReason.resourceKey=tests/e2e/**/*.spec.ts
# The configurator's 3D is React Three Fiber: <mesh position rotation material>, <lineSegments2 object>,
# <ambientLight intensity>, <planeGeometry args> are three.js objects' props, which the rule «Unknown property»
# (typescript:S6747) checks against the HTML DOM's attributes and flags as unknown. Scoped to the 3D's own folder.
sonar.issue.ignore.multicriteria.r3fIntrinsicProps.ruleKey=typescript:S6747
sonar.issue.ignore.multicriteria.r3fIntrinsicProps.resourceKey=app/components/configurator/three/**/*.tsx
# The same for the production-hidden R3F spike.
sonar.issue.ignore.multicriteria.r3fSpikeProps.ruleKey=typescript:S6747
sonar.issue.ignore.multicriteria.r3fSpikeProps.resourceKey=app/components/r3f-spike/**/*.tsx
# S6747 again: `blocking` is a real attribute of <link rel="expect">, which React passes through.
# DirectionDetail.tsx says why the hero needs it.
sonar.issue.ignore.multicriteria.linkBlocking.ruleKey=typescript:S6747
sonar.issue.ignore.multicriteria.linkBlocking.resourceKey=app/components/DirectionDetail.tsx
# S7767 wants Math.trunc for `| 0`, but mulberry32 needs the wrap to int32 that `| 0` does and
# Math.trunc does not: the swap would change every value the PRNG gives.
sonar.issue.ignore.multicriteria.prngInt32.ruleKey=typescript:S7767
sonar.issue.ignore.multicriteria.prngInt32.resourceKey=app/components/configurator/three/noiseField.ts
# S6845 forbids tabIndex on a non-interactive element; axe's scrollable-region-focusable requires
# it on these four: a wide table or a sideways drawing on a phone cannot be scrolled from the
# keyboard otherwise. Removing it would trade a smell for a real accessibility failure.
sonar.issue.ignore.multicriteria.scrollRegionApproaches.ruleKey=typescript:S6845
sonar.issue.ignore.multicriteria.scrollRegionApproaches.resourceKey=app/components/grain-planner/GrainApproachesOverview.tsx
sonar.issue.ignore.multicriteria.scrollRegionClarification.ruleKey=typescript:S6845
sonar.issue.ignore.multicriteria.scrollRegionClarification.resourceKey=app/components/planner/ClarificationMap.tsx
sonar.issue.ignore.multicriteria.scrollRegionComparison.ruleKey=typescript:S6845
sonar.issue.ignore.multicriteria.scrollRegionComparison.resourceKey=app/components/planner/ComparisonTable.tsx
sonar.issue.ignore.multicriteria.scrollRegionBuilder.ruleKey=typescript:S6845
sonar.issue.ignore.multicriteria.scrollRegionBuilder.resourceKey=app/components/zernoskhovyshcha/GrainComplexBuilder.tsx
# S6822 calls role="list" redundant, but `list-style: none` makes Safari drop a list's semantics
# unless the role is explicit.
sonar.issue.ignore.multicriteria.safariList.ruleKey=typescript:S6822
sonar.issue.ignore.multicriteria.safariList.resourceKey=app/components/home-v2/DirectionsIndex.tsx
# S2925 wants a wait to end on an observable condition. In these two the elapsed time is the test:
# Lenis's clock goes stale only with real time passing, and «no reload came» has no event to wait
# for. Every other wait in the two specs ends on a condition.
sonar.issue.ignore.multicriteria.restWindow.ruleKey=typescript:S2925
sonar.issue.ignore.multicriteria.restWindow.resourceKey=tests/e2e/smooth-scroll-idle.spec.ts
sonar.issue.ignore.multicriteria.noReloadWindow.ruleKey=typescript:S2925
sonar.issue.ignore.multicriteria.noReloadWindow.resourceKey=tests/e2e/island-failure.spec.ts
# Print isolation: the sheet alone on paper, whatever the page's cascade says. The other kept
# !important declarations are marked inline, see sonar.issue.ignore.block below.
sonar.issue.ignore.multicriteria.printIsolation.ruleKey=css:S9423
sonar.issue.ignore.multicriteria.printIsolation.resourceKey=app/components/configurator/print-sheet.css
# S6819 wants a native element in place of an ARIA role. None fits these:
#   SiteChrome          links and a button, already inside <address>, which cannot nest.
#   HangarEditorial     the stamp: a title, people, scope and CTAs. Not a form, not a disclosure.
#   ChangeBanner        role=status over block content; <output> takes phrasing content only.
#   FullscreenPreview   its wrapper must stay mounted and laid out while closed, and <dialog>
#                       without `open` is display: none, which zero-sizes the WebGL canvas. Its
#                       announcement is a live region only while active; <output> always is.
sonar.issue.ignore.multicriteria.groupMessengers.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.groupMessengers.resourceKey=app/components/SiteChrome.tsx
sonar.issue.ignore.multicriteria.groupStamp.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.groupStamp.resourceKey=app/components/angary/HangarEditorialArchitecture.tsx
sonar.issue.ignore.multicriteria.groupChangeBanner.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.groupChangeBanner.resourceKey=app/components/planner/ChangeBanner.tsx
sonar.issue.ignore.multicriteria.previewDialog.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.previewDialog.resourceKey=app/components/configurator/three/FullscreenPreviewFrame.tsx

# Kept !important declarations in the large stylesheets, each with its reason in the CSS. A block
# rather than a file rule, so a new !important anywhere else in those files is still reported.
sonar.issue.ignore.block=keptImportant
sonar.issue.ignore.block.keptImportant.beginBlockRegexp=sonar-important-begin
sonar.issue.ignore.block.keptImportant.endBlockRegexp=sonar-important-end

# Source encoding
sonar.sourceEncoding=UTF-8
